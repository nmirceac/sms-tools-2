name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 10 and 11 are end-of-life: every release has unpatched security
          # advisories, which Composer blocks by default. We still test against them.
          - { php: '8.1', laravel: '10.*', testbench: '8.*', eol: true }
          - { php: '8.2', laravel: '11.*', testbench: '9.*', eol: true }
          - { php: '8.3', laravel: '12.*', testbench: '10.*', eol: false }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', eol: false }
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - if: matrix.eol
        run: composer config policy.advisories.block false
      - run: composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
      - run: composer update --prefer-dist --no-interaction --with-all-dependencies
      - run: vendor/bin/phpunit
      - if: matrix.laravel == '13.*'
        run: vendor/bin/pint --test && vendor/bin/phpstan analyse --no-progress
